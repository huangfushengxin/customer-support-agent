<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客服 Agent · 对话工作台</title>
<style>
:root{color-scheme:light;--ink:#19383c;--muted:#61777a;--line:#d9e4e2;--accent:#146b62}
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1440px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{font-size:23px;margin:0;letter-spacing:.03em}header p{margin:4px 0 0;color:var(--muted);font-size:13px}a{color:var(--accent)}
main{max-width:1488px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:240px minmax(320px,1fr) 320px;gap:18px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 12px #19383c05}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:18px 0 4px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}
button{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 13px;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent);background:#edf7f3}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover:not(:disabled){background:#0d554e;color:white}.wide{width:100%}
.sessions{display:grid;gap:9px;margin-top:16px;max-height:65vh;overflow-y:auto}.session{text-align:left;padding:12px;word-break:break-word}.session.active{border-color:var(--accent);background:#edf7f3}.session small{display:block;color:var(--muted);margin-top:3px}
.chat-head{display:flex;justify-content:space-between;align-items:start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px}.chat-head h2{margin:0}.chip{display:inline-block;background:#edf5f2;color:var(--accent);border-radius:20px;font-size:12px;padding:4px 10px;white-space:nowrap}
#history{height:480px;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:20px 2px}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px 8px}.bubble{max-width:95%;background:#f0f5f4;border-radius:10px;padding:13px 16px;align-self:flex-start}.bubble.user{align-self:flex-end;background:#e6f1ed}.bubble strong{font-size:12px;color:var(--accent)}.body-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}.sources{font-size:12px;color:var(--muted);padding-left:18px;margin-bottom:0}
textarea{width:100%;resize:vertical;min-height:92px;font:inherit;padding:12px;border:1px solid #c7d6d3;border-radius:9px;background:#fff;color:var(--ink)}textarea:focus{outline:2px solid #76b9aa;outline-offset:1px}.compose-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.notice{min-height:24px;font-size:13px;color:var(--accent);margin-top:12px}.notice.error{color:#a23030}
.draft-value{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.draft-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}#missing{padding-left:20px;font-size:13px}#saved{background:#edf7f3;border-radius:8px;padding:12px;margin:14px 0}#confirm{margin-top:16px}label{display:block;margin-bottom:7px;font-weight:600}
@media(max-width:1120px){main{grid-template-columns:210px minmax(320px,1fr)}#draft-card{grid-column:2}}
@media(max-width:700px){header{padding:18px;align-items:start}header a{white-space:nowrap}main{display:flex;flex-direction:column;padding:0 12px;margin:12px 0}.card{width:100%;padding:16px}.sessions{max-height:170px}#history{height:380px}.compose-foot{align-items:end}.compose-foot .muted{max-width:190px}}
</style>
</head>
<body>
<header><div><h1>客服 Agent</h1><p>查询产品资料，整理问题，确认后创建工单。</p></div><a href="/page">工单管理 →</a></header>
<main>
<aside class="card"><h2>我的会话</h2><button id="new-session" class="primary wide">＋ 新会话</button><button id="refresh" class="wide" style="margin-top:8px">刷新列表</button><p class="muted">旧会话会保留，点击即可继续。当前为本机单用户工作台。</p><div id="sessions" class="sessions" aria-label="已有会话"></div></aside>
<section class="card"><div class="chat-head"><div><h2 id="chat-title">开始一段对话</h2><p id="chat-subtitle" class="muted">点击“新会话”，或从左侧恢复已有会话。</p></div><span id="phase" class="chip">尚未选择会话</span></div>
<div id="history" aria-label="对话记录"><p class="empty">从一个问题开始。<br>例如：软件激活失败，提示授权无效。</p></div>
<form id="message-form"><label for="message">描述问题或补充信息</label><textarea id="message" maxlength="2000" placeholder="例如：版本是 2.0，系统是 Windows 11，请更新工单草稿。" disabled></textarea><div class="compose-foot"><span class="muted">发送会调用模型；查看会话和确认保存不调用模型。</span><button id="send" class="primary" type="submit" disabled>发送消息</button></div></form>
<p id="notice" class="notice" role="status" aria-live="polite"></p></section>
<aside id="draft-card" class="card"><h2>当前工单草稿</h2><p id="no-draft" class="muted">对话中说“帮我整理工单”，草稿会显示在这里。</p><div id="draft-content" hidden><span id="category" class="chip"></span><h3>标题</h3><p id="draft-title" class="draft-value"></p><h3>问题描述</h3><p id="draft-description" class="draft-value"></p><div class="draft-block"><h3>建议补充</h3><ul id="missing"></ul></div><p class="muted">需要修改时，请在对话中说明。核对最新草稿后再确认保存。</p></div><div id="saved" hidden></div><button id="confirm" class="primary wide" disabled>确认保存当前草稿</button><p class="muted">生成草稿不会创建正式工单。确认后返回工单编号。</p></aside>
</main>
<script>
let current=null, busy=false;
const byId=id=>document.getElementById(id);
function notice(text,error=false){byId('notice').textContent=text;byId('notice').className='notice'+(error?' error':'');}
function remember(id){try{if(id)localStorage.setItem('agent-thread-id',id);else localStorage.removeItem('agent-thread-id');}catch{}}
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=busy);const closed=Boolean(current?.saved_ticket_id);byId('message').disabled=busy||!current||closed;byId('send').disabled=busy||!current||closed;byId('confirm').disabled=busy||!current?.draft||!current?.draft_token||closed;}
async function api(url,body){const response=await fetch(url,{cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});let data;try{data=await response.json();}catch{throw new Error('服务返回异常，请稍后刷新会话。');}if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'输入格式不正确，请检查后再试。');return data;}
async function action(work){if(busy)return;busy=true;controls();try{await work();}catch(error){notice(error.message||'连接失败，请刷新会话查看最后保存的结果。',true);}finally{busy=false;controls();}}
function paint(session){current=session;remember(session.thread_id);byId('chat-title').textContent='会话 '+session.thread_id.slice(0,8);byId('chat-subtitle').textContent='对话与草稿已自动保存，重新打开页面可继续。';byId('phase').textContent=session.saved_ticket_id?'已创建工单':session.draft?'等待核对':'对话中';const feed=byId('history');feed.replaceChildren();if(!session.history.length){const p=document.createElement('p');p.className='empty';p.textContent='告诉我你遇到的问题，也可以直接请求整理工单。';feed.appendChild(p);}for(const message of session.history){const bubble=document.createElement('article');bubble.className='bubble'+(message.role==='user'?' user':'');const author=document.createElement('strong');author.textContent=message.role==='user'?'你':'客服 Agent';const body=document.createElement('div');body.className='body-text';body.textContent=message.content;bubble.append(author,body);if(message.sources?.length){const sources=document.createElement('ul');sources.className='sources';for(const source of message.sources){const li=document.createElement('li');li.textContent=`[${source.id}] ${source.source}`;sources.appendChild(li);}bubble.appendChild(sources);}feed.appendChild(bubble);}feed.scrollTop=feed.scrollHeight;const draft=session.draft;byId('no-draft').hidden=Boolean(draft);byId('draft-content').hidden=!draft;if(draft){byId('category').textContent=draft.category;byId('draft-title').textContent=draft.title;byId('draft-description').textContent=draft.description;byId('missing').replaceChildren();for(const item of draft.missing_info.length?draft.missing_info:['暂未发现缺失信息，请人工核对。']){const li=document.createElement('li');li.textContent=item;byId('missing').appendChild(li);}}byId('saved').hidden=!session.saved_ticket_id;byId('saved').textContent=session.saved_ticket_id?`工单 ${session.saved_ticket_id} 已保存。可进入右上角“工单管理”按编号查询。`:'';if(session.incomplete)notice('上次处理未完成，当前显示最后成功的对话与草稿。请核对后重新输入需要补充的信息。',true);controls();}
async function refreshSessions(){const data=await api('/agent/sessions');const list=byId('sessions');list.replaceChildren();if(!data.sessions.length){const p=document.createElement('p');p.className='muted';p.textContent='还没有会话，点击上方开始。';list.appendChild(p);}for(const item of data.sessions){const b=document.createElement('button');b.type='button';b.className='session'+(item.thread_id===current?.thread_id?' active':'');b.disabled=busy;const title=document.createElement('span');title.textContent='会话 '+item.thread_id.slice(0,8);const detail=document.createElement('small');detail.textContent=`${item.turns} 轮 · `+(item.ticket_id?`工单 ${item.ticket_id}`:item.has_draft?'待确认草稿':'尚无草稿');b.append(title,detail);b.addEventListener('click',()=>action(async()=>{notice('正在恢复会话……');paint(await api('/agent/sessions/'+item.thread_id));await refreshSessions();if(!current.incomplete)notice('会话已恢复。');}));list.appendChild(b);}}
byId('new-session').addEventListener('click',()=>action(async()=>{paint(await api('/agent/sessions',{}));byId('message').value='';await refreshSessions();notice('新会话已建立，旧会话仍保留。');}));
byId('refresh').addEventListener('click',()=>action(async()=>{if(current)paint(await api('/agent/sessions/'+current.thread_id));await refreshSessions();if(!current?.incomplete)notice('会话列表已刷新。');}));
byId('message-form').addEventListener('submit',event=>{event.preventDefault();if(busy||!current||current.saved_ticket_id)return;const message=byId('message').value.trim();if(!message){notice('请先输入问题或补充信息。',true);return;}action(async()=>{notice('Agent 正在处理，请稍候……');const id=current.thread_id;try{paint(await api(`/agent/sessions/${id}/messages`,{message}));byId('message').value='';await refreshSessions();notice('本轮对话已保存。');}catch(error){try{paint(await api('/agent/sessions/'+id));}catch{}throw error;}});});
byId('confirm').addEventListener('click',()=>{if(busy||!current?.draft||current.saved_ticket_id)return;const id=current.thread_id,token=current.draft_token;if(!window.confirm('确认按右侧显示的草稿创建正式工单吗？'))return;action(async()=>{notice('正在保存工单……');try{const data=await api(`/agent/sessions/${id}/confirm`,{draft_token:token});paint(data);await refreshSessions();notice(data.confirmation.already_saved?'工单已保存，未重复创建。':`保存成功，工单编号：${data.saved_ticket_id}。`);}catch(error){try{paint(await api('/agent/sessions/'+id));}catch{}throw error;}});});
action(async()=>{await refreshSessions();let id;try{id=localStorage.getItem('agent-thread-id');}catch{}if(id){try{paint(await api('/agent/sessions/'+encodeURIComponent(id)));await refreshSessions();if(!current.incomplete)notice('已恢复上次打开的会话。');}catch(error){remember(null);notice('上次的会话暂时无法恢复，请从左侧列表选择。',true);}}});
</script>
</body>
</html>
