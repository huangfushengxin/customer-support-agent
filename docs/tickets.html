<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演示工单 · 客服 Agent</title>
<style>body{max-width:850px;margin:35px auto;padding:0 20px;color:#19383c;background:#f3f6f5;font:15px/1.7 system-ui,sans-serif}a{color:#146b62}.card{background:white;border:1px solid #d9e4e2;border-radius:14px;padding:24px;margin:18px 0}input,button{font:inherit;padding:9px;border:1px solid #bacfca;border-radius:7px}button{background:#146b62;color:white;cursor:pointer}article{border-top:1px solid #d9e4e2;padding:14px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#61777a}input{max-width:120px}</style></head>
<body><a href="./">← 返回 Agent 对话</a><h1>演示工单</h1><p class="muted">以下记录仅保存在当前浏览器中，不是正式客服工单。其他访客看不到你的记录。</p>
<section class="card"><form id="query"><label for="ticket-id">工单编号 </label><input type="number" min="1" required id="ticket-id"><button>查询</button> <button type="button" id="all">查看全部</button></form><p id="status" role="status"></p><div id="records"></div></section>
<script type="module">
import {DemoStore} from './demo-store.mjs';
const store = new DemoStore({getItem:key=>window.localStorage.getItem(key),setItem:(key,value)=>window.localStorage.setItem(key,value)}, []), records = document.getElementById('records');
function show(id){try{const tickets=store.tickets().filter(t=>!id||t.id===id);records.replaceChildren();document.getElementById('status').textContent=tickets.length?`共 ${tickets.length} 张演示工单`:'没有找到工单，请先在对话页核对并保存草稿。';for(const ticket of tickets){const article=document.createElement('article');const h=document.createElement('h2');h.textContent=`工单 ${ticket.id} · ${ticket.title}`;const meta=document.createElement('p');meta.textContent=`${ticket.category} · ${ticket.status}`;const description=document.createElement('p');description.textContent=ticket.description;article.append(h,meta,description);records.appendChild(article);}}catch(error){document.getElementById('status').textContent=error.message;}}
document.getElementById('query').addEventListener('submit',event=>{event.preventDefault();show(Number(document.getElementById('ticket-id').value));});document.getElementById('all').addEventListener('click',()=>show());show();
</script></body></html>
